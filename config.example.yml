# =============================================================================
# Mesh MQTT Server - Example Configuration
# =============================================================================
# Copy this file to config.yml and adjust values for your deployment.
# All sections are optional unless noted otherwise.

# Log level: debug, info, warn, error (default: info)
# Can be overridden with LOG_LEVEL or DEBUG env vars
# logLevel: info

# Log format: color (default), json, journal (systemd)
# Can be overridden with LOG_FORMAT env var
# logFormat: color

# Address the web UI listens on (default: ":8000")
listenAddr: ":8000"

# Optional MQTT-over-WebSocket listener address. The plaintext TCP listener on
# :1883 is always started; set this to also accept MQTT over WebSocket. TLS is
# expected to be terminated by a reverse proxy (e.g. nginx), so this speaks
# plaintext ws. Leave unset to disable.
# mqttWebsocketAddr: ":1882"

# Public-facing URL for OAuth callbacks and links
baseURL: "http://localhost:8000"

# Secret used for session cookies (change this to a random string)
sessionSecret: "change-me-to-a-random-secret"

# =============================================================================
# Database (PostgreSQL) - REQUIRED
# =============================================================================
database:
  host: "localhost:5432"
  db: mesht_mqtt
  user: mesht_mqtt
  password: "your-database-password"

# =============================================================================
# OAuth (Discord) - Required for web UI authentication
# =============================================================================
oauth:
  discord:
    clientId: "your-discord-client-id"
    clientSecret: "your-discord-client-secret"

# =============================================================================
# Discord Settings
# =============================================================================
discord:
  # Discord server (guild) ID for membership verification
  guildId: "your-discord-guild-id"
  # Discord role ID that grants admin access (optional)
  # Users with this role can view all nodes, map, and manage non-superuser users.
  # adminRoleId: "1234567890123456789"
  # Bot token for background admin role syncing (optional).
  # When set alongside adminRoleId, the server periodically checks each
  # registered user's Discord roles and updates their admin status.
  # Requires the bot to be added to the guild with no special permissions.
  # botToken: "your-discord-bot-token"

# =============================================================================
# Meshtastic Settings
# =============================================================================
meshSettings:
  # MQTT topic root for Meshtastic messages (e.g., "msh/US", "msh/EU")
  mqttRoot: msh/US

  # Identity this server uses when sending packets to the mesh
  selfNode:
    nodeID: "!aabbccdd"
    longName: "My MQTT Server"
    shortName: "MQTT"

  # Meshtastic channel definitions
  # Each channel needs a name and its PSK (base64-encoded).
  # "AQ==" is the default key for standard channels like LongFast.
  # Set export: true to include the channel in data exports.
  channels:
    - name: LongFast
      key: "AQ=="
      export: true
    - name: MediumFast
      key: "AQ=="
      export: false
    # Example custom channel with a unique PSK:
    # - name: MyPrivateChannel
    #   key: "base64-encoded-psk-here"
    #   export: true

  # Ordered list of channel names to try when verifying a node's downlink.
  # The server tries each channel until it gets a response, then remembers
  # which channel worked for that node.
  # verificationChannels:
  #   - LongFast
  #   - MediumFast

  # Disable gateway topics system-wide.
  # When enabled, clients cannot subscribe to gateway topics (msh/.../Gateway/...)
  # and all publishes to gateway topics are redirected to non-gateway topics.
  # This effectively forces all clients to use the standard topic structure
  # and disables the gateway validation system.
  # disableGatewayTopics: false

  # Per-node rate limiting for mesh packets.
  # Limits how many unique packets a single mesh node can send within a time
  # window. Duplicate packets (same packet ID from different gateways) are
  # always allowed through for RF path analysis by mapping software.
  # rateLimit:
  #   enabled: false
  #   maxPackets: 50   # max unique packets per node per window
  #   window: "1m"     # time window duration

# =============================================================================
# MeshCore Protocol Support
# =============================================================================
# Enables processing of MeshCore protocol packets received via MQTT.
# MeshCore clients (client ID: meshcore-bridge-*) publish base64-encoded
# packets to {topicPrefix}/{mesh_id} topics.
meshCore:
  enabled: false
  # MQTT topic prefix for MeshCore packets (default: "meshcore")
  # topicPrefix: meshcore

  # MeshCore observer ingest. Observer clients (e.g. meshcore-room-server)
  # publish JSON status and per-packet telemetry to
  # {topicPrefix}/{IATA}/{PUBKEY}/{status,packets} and authenticate with a
  # "v1_<PUBKEY>" username plus an Ed25519-signed JWT or nonce password. The
  # signature proves ownership of the key, so no per-observer provisioning is
  # needed.
  observer:
    enabled: false
    # Topic prefix for observer topics (default: "meshcore")
    # topicPrefix: meshcore
    # If set, reject observer JWTs whose "aud" claim does not match this value
    # (typically the broker hostname). Leave empty to skip the audience check.
    # requireAudience: mqtt.example.com

# =============================================================================
# MeshSense Integration
# =============================================================================
# Forward node data (position, telemetry, node info, trace routes) to a
# MeshSense instance. Defaults to the public MeshSense global map if no
# custom URL is specified.
meshSense:
  enabled: false
  # URL of the MeshSense server (default: "https://meshsense.affirmatech.com")
  # url: "https://meshsense.affirmatech.com"

# =============================================================================
# MQTT Forwarding
# =============================================================================
# Forward MQTT packets to one or more external MQTT brokers.
# Useful for relaying to the public Meshtastic MQTT server or other brokers.
forwarding:
  enabled: false
  targets:
    - name: "meshtastic-public"
      address: "mqtt.meshtastic.org:1883"
      username: meshdev
      password: large4cats
      useTLS: false
      # clientID: "my-custom-client-id"    # Auto-generated if empty
      topics:
        - "msh/#"
      # Rewrite topic prefixes before forwarding.
      # Key is the prefix to match, value is the replacement.
      # topicRewrites:
      #   "msh/US/2/e": "msh/US/PA/MyRegion/2/e"
